<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP Reader with Library + Line Numbers + iPad Fix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --bg-softer: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.15);
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --text-soft: #9ca3af;
      --border: #1f2937;
      --danger: #f97373;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-soft: 0 18px 45px rgba(15,23,42,0.85);
      --fade-duration: 300ms;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    /* Sidebar */

    .sidebar {
      width: 320px;
      min-width: 260px;
      max-width: 360px;
      background: linear-gradient(145deg, #020617, #020617);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: var(--shadow-soft);
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .sidebar-summary {
      font-size: 11px;
      color: var(--text-soft);
    }

    .sidebar-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sidebar-search {
      flex: 1;
      background: #020617;
      border-radius: var(--radius-md);
      border: 1px solid rgba(148,163,184,0.25);
      padding: 6px 9px;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .sidebar-search::placeholder {
      color: #4b5563;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      background: radial-gradient(circle at top left, #1f2937 0, #020617 65%);
      color: var(--text);
      font-size: 11px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary {
      border-color: rgba(56,189,248,0.7);
      background: radial-gradient(circle at top left, #0f172a 0, #020617 65%);
      color: var(--accent);
    }

    .btn-ghost {
      background: transparent;
      border-color: rgba(148,163,184,0.25);
    }

    .btn-danger {
      border-color: rgba(248,113,113,0.7);
      color: #fecaca;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .library-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 2px 4px 0;
      margin-right: 2px;
    }

    .item-card {
      border-radius: var(--radius-md);
      border: 1px solid rgba(148,163,184,0.25);
      background: radial-gradient(circle at top left, #020617 0, #020617 65%);
      padding: 8px 9px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      font-size: 11px;
      color: var(--text-soft);
      white-space: nowrap;
    }

    .item-progress-bar {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      overflow: hidden;
    }

    .item-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #a3e635);
      width: 0%;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .item-actions .btn {
      font-size: 10px;
      padding: 4px 8px;
    }

    /* Main */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .badge {
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      color: var(--text-soft);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-soft);
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.25);
      background: radial-gradient(circle at top left, #020617 0, #020617 65%);
    }

    .control-group label {
      font-size: 11px;
      color: var(--text-soft);
    }

    .control-group input[type="range"] {
      width: 110px;
    }

    .pill-row {
      display: inline-flex;
      gap: 4px;
      padding: 2px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.25);
    }

    .pill {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
    }

    .pill.active {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
    }

    /* Editor & Reader */

    .panel {
      flex: 1;
      display: flex;
      gap: 12px;
    }

    .editor-panel,
    .reader-panel {
      flex: 1;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.25);
      background: radial-gradient(circle at top left, #020617 0, #020617 65%);
      box-shadow: var(--shadow-soft);
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .editor-panel {
      display: flex;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-soft);
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border-radius: var(--radius-md);
      border: 1px solid rgba(148,163,184,0.25);
      background: #020617;
      color: var(--text);
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
    }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-soft);
    }

    .reader-panel {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .reader-panel.active {
      display: flex;
    }

    .reader-inner {
      max-width: 700px;
      width: 100%;
      text-align: center;
      padding: 12px;
    }

    .orp-word {
      font-size: 64px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text);
      font-variant-ligatures: none;
      white-space: nowrap;
    }

    .orp-word .orp {
      color: #ef4444;
    }

    .reader-sub {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-soft);
    }

    /* Bottom controls (fullscreen) */

    .fullscreen-controls {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade-duration) ease;
    }

    .fullscreen-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .fullscreen-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .fullscreen-buttons .btn {
      font-size: 11px;
      padding: 5px 10px;
    }

    .fullscreen-speed {
      width: 220px;
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-soft);
      justify-content: center;
    }

    .fullscreen-speed.visible {
      display: flex;
    }

    .fullscreen-speed input[type="range"] {
      width: 160px;
    }

    .indicator {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 11px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .indicator.visible {
      opacity: 1;
    }

    /* Hidden exit hotspot */

    .exit-hotspot {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 60px;
      opacity: 0;
      z-index: 10;
    }

    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
        height: auto;
      }
      .sidebar {
        width: 100%;
        max-width: none;
        order: 2;
        height: 260px;
      }
      .main {
        order: 1;
        height: calc(100vh - 280px);
      }
      .panel {
        flex-direction: column;
      }
    }

    /* Fullscreen mode overrides */

    body.fullscreen-mode {
      background: #000000 !important;
      height: 100dvh !important;
      overflow: hidden !important;
    }

    body.fullscreen-mode .app-shell {
      padding: 0;
      max-width: 100%;
      height: 100dvh;
    }

    body.fullscreen-mode .sidebar,
    body.fullscreen-mode .top-bar,
    body.fullscreen-mode .controls-row,
    body.fullscreen-mode .editor-panel,
    body.fullscreen-mode .editor-footer,
    body.fullscreen-mode .editor-header,
    body.fullscreen-mode #charCount {
      display: none !important;
    }

    body.fullscreen-mode .main {
      padding: 0;
      height: 100dvh;
    }

    body.fullscreen-mode .reader-panel {
      border-radius: 0;
      border: none;
      box-shadow: none;
      background: #000000;
      height: 100dvh !important;
    }

    body.fullscreen-mode .reader-inner {
      max-width: none;
    }

    body.fullscreen-mode .orp-word {
      font-size: 72px;
    }

    body.fullscreen-mode .reader-sub {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar / Library -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="sidebar-title">Library</div>
          <div class="sidebar-summary" id="librarySummary">0 items</div>
        </div>
        <button class="btn btn-ghost" id="newItemBtn">+ New</button>
      </div>

      <div class="sidebar-row">
        <input
          type="text"
          id="librarySearch"
          class="sidebar-search"
          placeholder="Search titles or text..."
        />
        <button class="btn btn-ghost" id="exportLibraryBtn">Export</button>
        <button class="btn btn-ghost" id="importLibraryBtn">Import</button>
        <input
          type="file"
          id="libraryImportInput"
          accept="application/json"
          style="display:none"
        />
      </div>

      <div class="library-list" id="libraryList"></div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="top-bar">
        <div class="top-left">
          <div class="app-title">RSVP Reader</div>
          <div class="badge">M2‑C · iPad‑friendly</div>
        </div>
        <div class="controls-row">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn" id="saveToLibraryBtn">Save to library</button>
          <button class="btn btn-ghost" id="fullscreenBtn">Fullscreen</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="control-group">
          <label>Speed</label>
          <input type="range" id="speedControl" min="150" max="1200" step="50" value="400" />
          <span id="speedValue">400</span>
          <span>WPM</span>
        </div>
        <div class="control-group">
          <label>Font</label>
          <input type="range" id="fontControl" min="32" max="80" step="2" value="64" />
          <span id="fontValue">64</span>
          <span>px</span>
        </div>
        <div class="control-group">
          <label>ORP</label>
          <input type="range" id="orpOffsetControl" min="0" max="4" step="1" value="2" />
          <span id="orpOffsetValue">2</span>
        </div>
        <div class="control-group">
          <label>Mode</label>
          <div class="pill-row" id="modePills">
            <button class="pill active" data-mode="single">Single</button>
            <button class="pill" data-mode="conservative">Conservative</button>
            <button class="pill" data-mode="balanced">Balanced</button>
            <button class="pill" data-mode="semantic">Smart</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <!-- Editor -->
        <section class="editor-panel" id="editorPanel">
          <div style="flex:1;display:flex;flex-direction:column;">
            <div class="editor-header">
              <span>Source text</span>
              <span id="charCount">0 characters</span>
            </div>
            <textarea id="inputText" placeholder="Paste or type your text here..."></textarea>
            <div class="editor-footer">
              <span>Every saved text is added to the library with progress tracking.</span>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-ghost" id="clearTextBtn">Clear</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Reader -->
        <section class="reader-panel" id="readerPanel">
          <div class="exit-hotspot" id="exitHotspot"></div>
          <div class="reader-inner">
            <div class="orp-word" id="orpWord"></div>
            <div class="reader-sub" id="readerSub"></div>
          </div>

          <!-- Bottom fullscreen controls -->
          <div class="fullscreen-controls" id="fullscreenControls">
            <div class="fullscreen-buttons">
              <button class="btn" id="rewindBtn">⏪ -50</button>
              <button class="btn" id="pauseBtn">Pause</button>
              <button class="btn" id="resumeBtn" style="display:none;">Resume</button>
              <button class="btn" id="stopBtn">Stop</button>
              <button class="btn" id="skipBtn">+50 ⏩</button>
            </div>
            <div class="fullscreen-speed" id="fullscreenSpeed">
              <span>Speed</span>
              <input type="range" id="speedControlFs" min="150" max="1200" step="50" value="400" />
              <span id="speedValueFs">400</span>
            </div>
          </div>

          <div class="indicator" id="indicator"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    /* ============================================================
       RSVP ENGINE
       ============================================================ */

    let rsvpWords = [];
    let rsvpChunks = [];
    let rsvpIndex = 0;
    let rsvpMode = "single";
    let rsvpSpeed = 400;
    let rsvpDelay = 60000 / rsvpSpeed;
    let rsvpPaused = false;
    let rsvpRunning = false;
    let rsvpLastFrame = 0;
    let rsvpAccum = 0;
    let rsvpORPOffset = 2;

    let currentLibraryItemId = null;
    let onProgressUpdate = null;

    let cleanMode = true;

    const orpWord = document.getElementById("orpWord");
    const readerPanel = document.getElementById("readerPanel");
    const editorPanel = document.getElementById("editorPanel");
    const readerSub = document.getElementById("readerSub");
    const indicator = document.getElementById("indicator");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const stopBtn = document.getElementById("stopBtn");
    const rewindBtn = document.getElementById("rewindBtn");
    const skipBtn = document.getElementById("skipBtn");

    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fullscreenControls = document.getElementById("fullscreenControls");
    const fullscreenSpeed = document.getElementById("fullscreenSpeed");
    const speedControlFs = document.getElementById("speedControlFs");
    const speedValueFs = document.getElementById("speedValueFs");
    const exitHotspot = document.getElementById("exitHotspot");

    const speedControl = document.getElementById("speedControl");
    const speedValue = document.getElementById("speedValue");
    const fontControl = document.getElementById("fontControl");
    const fontValue = document.getElementById("fontValue");
    const orpOffsetControl = document.getElementById("orpOffsetControl");
    const orpOffsetValue = document.getElementById("orpOffsetValue");
    const modePills = document.querySelectorAll("#modePills .pill");

    const inputText = document.getElementById("inputText");
    const charCount = document.getElementById("charCount");

    function isIpadSafari() {
      return (
        navigator.userAgent.includes("iPad") ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    function setSpeed(wpm) {
      rsvpSpeed = wpm;
      rsvpDelay = 60000 / wpm;
      speedValue.textContent = wpm;
      speedControl.value = wpm;
      speedValueFs.textContent = wpm;
      speedControlFs.value = wpm;
    }

    speedControl.addEventListener("input", () => setSpeed(+speedControl.value));
    speedControlFs.addEventListener("input", () => setSpeed(+speedControlFs.value));

    fontControl.addEventListener("input", () => {
      const size = +fontControl.value;
      fontValue.textContent = size;
      orpWord.style.fontSize = size + "px";
      ensureWordFits();
    });

    orpOffsetControl.addEventListener("input", () => {
      rsvpORPOffset = +orpOffsetControl.value;
      orpOffsetValue.textContent = rsvpORPOffset;
    });

    modePills.forEach((pill) => {
      pill.addEventListener("click", () => {
        modePills.forEach((p) => p.classList.remove("active"));
        pill.classList.add("active");
        rsvpMode = pill.dataset.mode;
      });
    });

    inputText.addEventListener("input", () => {
      charCount.textContent = inputText.value.length + " characters";
    });

    function tokenize(text) {
      return text.replace(/\s+/g, " ").trim().split(" ");
    }

    function isBoundary(word) {
      return /[.!?;:—–-]$/.test(word);
    }

    const PREP = new Set([
      "in","on","at","to","for","from","with","about","against","between","into",
      "through","during","before","after","above","below","under","over","within",
      "without","across","behind","beyond","around","near","of","off","up","down","by"
    ]);
    const CONJ = new Set([
      "and","but","or","so","yet","nor","for","although","though","because","while",
      "whereas","unless","until","since","once"
    ]);

    function chunkConservative(arr) {
      const out = [];
      let cur = [];
      for (const w of arr) {
        cur.push(w);
        if (isBoundary(w) || cur.length >= 3) {
          out.push(cur.join(" "));
          cur = [];
        }
      }
      if (cur.length) out.push(cur.join(" "));
      return out;
    }

    function chunkBalanced(arr) {
      const out = [];
      let cur = [];
      for (const w of arr) {
        const lw = w.toLowerCase();
        cur.push(w);
        if (isBoundary(w)) {
          out.push(cur.join(" "));
          cur = [];
          continue;
        }
        if (cur.length <= 6 && (PREP.has(lw) || CONJ.has(lw))) continue;
        if (cur.length >= 5) {
          out.push(cur.join(" "));
          cur = [];
        }
      }
      if (cur.length) out.push(cur.join(" "));
      return out;
    }

    function chunkSemantic(arr) {
      const out = [];
      let cur = [];
      for (const w of arr) {
        const lw = w.toLowerCase();
        cur.push(w);
        if (isBoundary(w)) {
          out.push(cur.join(" "));
          cur = [];
          continue;
        }
        if (cur.length >= 7) {
          out.push(cur.join(" "));
          cur = [];
          continue;
        }
        if (CONJ.has(lw) || PREP.has(lw)) continue;
        if (cur.length >= 4) {
          out.push(cur.join(" "));
          cur = [];
        }
      }
      if (cur.length) out.push(cur.join(" "));
      return out;
    }

    function buildChunks(arr, mode) {
      if (mode === "conservative") return chunkConservative(arr);
      if (mode === "balanced") return chunkBalanced(arr);
      if (mode === "semantic") return chunkSemantic(arr);
      return arr;
    }

    function getORPIndex(word) {
      const clean = word.replace(/^[^\w]+|[^\w]+$/g, "");
      if (!clean) return 0;
      return Math.min(rsvpORPOffset, clean.length - 1);
    }

    function highlightORP(word) {
      const leading = word.match(/^[^\w]+/)?.[0] || "";
      const trailing = word.match(/[^\w]+$/)?.[0] || "";
      const core = word.replace(/^[^\w]+|[^\w]+$/g, "");
      if (!core) return word;
      const pivot = getORPIndex(core);
      return (
        leading +
        core.slice(0, pivot) +
        '<span class="orp">' +
        core[pivot] +
        "</span>" +
        core.slice(pivot + 1) +
        trailing
      );
    }

    function highlightChunk(chunk) {
      const parts = chunk.split(" ");
      const mid = Math.floor(parts.length / 2);
      parts[mid] = highlightORP(parts[mid]);
      return parts.join(" ");
    }

    function ensureWordFits() {
      const container = readerPanel;
      const wordEl = orpWord;
      if (!container || !wordEl) return;
      const baseSize = +fontControl.value || 64;
      let size = baseSize;
      wordEl.style.fontSize = size + "px";
      if (wordEl.scrollWidth <= container.clientWidth * 0.95) return;
      while (wordEl.scrollWidth > container.clientWidth * 0.95 && size > 20) {
        size -= 2;
        wordEl.style.fontSize = size + "px";
      }
    }

    function renderToken() {
      if (rsvpMode === "single") {
        orpWord.innerHTML = highlightORP(rsvpWords[rsvpIndex] || "");
      } else {
        orpWord.innerHTML = highlightChunk(rsvpChunks[rsvpIndex] || "");
      }
      readerSub.textContent =
        (rsvpIndex + 1) + " / " +
        (rsvpMode === "single" ? rsvpWords.length : rsvpChunks.length);
      ensureWordFits();
    }

    function computeDelay(token) {
      const last = token.trim().slice(-1);
      if (/[.!?]/.test(last)) return rsvpDelay * 3;
      if (/[,;:]/.test(last)) return rsvpDelay * 2;
      return rsvpDelay;
    }

    function showIndicator(text) {
      indicator.textContent = text;
      indicator.classList.add("visible");
      clearTimeout(showIndicator._t);
      showIndicator._t = setTimeout(() => {
        indicator.classList.remove("visible");
      }, 800);
    }

    async function enterFullscreen() {
      if (isIpadSafari()) {
        document.body.classList.add("fullscreen-mode");
        cleanMode = true;
        updateControlsVisibility();
        ensureWordFits();
        return;
      }
      try {
        await document.documentElement.requestFullscreen();
      } catch {}
      document.body.classList.add("fullscreen-mode");
      cleanMode = true;
      updateControlsVisibility();
      ensureWordFits();
    }

    function exitFullscreen() {
      if (!isIpadSafari() && document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen();
      }
      document.body.classList.remove("fullscreen-mode");
      cleanMode = true;
      updateControlsVisibility();
      ensureWordFits();
    }

    function updateControlsVisibility() {
      const inFs = document.body.classList.contains("fullscreen-mode");
      if (!inFs) {
        fullscreenControls.classList.remove("visible");
        fullscreenSpeed.classList.remove("visible");
        readerSub.style.display = "block";
        return;
      }
      if (cleanMode) {
        fullscreenControls.classList.remove("visible");
        fullscreenSpeed.classList.remove("visible");
        readerSub.style.display = "none";
      } else {
        fullscreenControls.classList.add("visible");
        readerSub.style.display = "block";
        if (rsvpPaused) {
          fullscreenSpeed.classList.add("visible");
        } else {
          fullscreenSpeed.classList.remove("visible");
        }
      }
    }

    function forceStartReading(startIndex = 0, fullscreen = false) {
      const text = inputText.value.trim();
      if (!text) return;
      rsvpWords = tokenize(text);
      rsvpChunks = buildChunks(rsvpWords, rsvpMode);
      const maxIndex =
        (rsvpMode === "single" ? rsvpWords.length : rsvpChunks.length) - 1;
      rsvpIndex = Math.max(0, Math.min(startIndex, maxIndex));
      rsvpRunning = true;
      rsvpPaused = false;
      rsvpAccum = 0;
      rsvpLastFrame = performance.now();
      editorPanel.style.display = "none";
      readerPanel.classList.add("active");
      pauseBtn.style.display = "inline-flex";
      resumeBtn.style.display = "none";
      if (fullscreen) {
        enterFullscreen();
      } else {
        document.body.classList.remove("fullscreen-mode");
        cleanMode = false;
        updateControlsVisibility();
      }
      renderToken();
      requestAnimationFrame(loop);
    }

    function startReading() {
      currentLibraryItemId = autoAddCurrentText();
      forceStartReading(0, false);
    }

    function startReadingFullscreen() {
      currentLibraryItemId = autoAddCurrentText();
      forceStartReading(0, true);
    }

    function loop(ts) {
      if (!rsvpRunning || rsvpPaused) return;
      const delta = ts - rsvpLastFrame;
      rsvpLastFrame = ts;
      rsvpAccum += delta;
      const token =
        rsvpMode === "single" ? rsvpWords[rsvpIndex] : rsvpChunks[rsvpIndex];
      const delay = computeDelay(token || "");
      if (rsvpAccum >= delay) {
        rsvpAccum -= delay;
        advance();
      }
      if (rsvpRunning) requestAnimationFrame(loop);
    }

    function advance() {
      const max =
        rsvpMode === "single" ? rsvpWords.length : rsvpChunks.length;
      rsvpIndex++;
      if (rsvpIndex >= max) {
        stopReading();
        return;
      }
      renderToken();
      if (onProgressUpdate && currentLibraryItemId) {
        onProgressUpdate(currentLibraryItemId, rsvpIndex, rsvpMode, rsvpSpeed);
      }
    }

    function pauseReading() {
      if (!rsvpRunning || rsvpPaused) return;
      rsvpPaused = true;
      pauseBtn.style.display = "none";
      resumeBtn.style.display = "inline-flex";
      showIndicator("Paused");
      updateControlsVisibility();
    }

    function resumeReading() {
      if (!rsvpRunning || !rsvpPaused) return;
      rsvpPaused = false;
      resumeBtn.style.display = "none";
      pauseBtn.style.display = "inline-flex";
      rsvpLastFrame = performance.now();
      requestAnimationFrame(loop);
      showIndicator("Resume");
      updateControlsVisibility();
    }

    function stopReading() {
      rsvpRunning = false;
      rsvpPaused = false;
      rsvpIndex = 0;
      orpWord.innerHTML = "";
      readerSub.textContent = "";
      editorPanel.style.display = "flex";
      readerPanel.classList.remove("active");
      pauseBtn.style.display = "inline-flex";
      resumeBtn.style.display = "none";
      exitFullscreen();
    }

    function rewind() {
      const max =
        rsvpMode === "single" ? rsvpWords.length : rsvpChunks.length;
      rsvpIndex = Math.max(0, rsvpIndex - 50);
      if (rsvpIndex >= max) rsvpIndex = max - 1;
      renderToken();
      showIndicator("⏪ -50");
    }

    function skip() {
      const max =
        rsvpMode === "single" ? rsvpWords.length : rsvpChunks.length;
      rsvpIndex = Math.min(max - 1, rsvpIndex + 50);
      renderToken();
      showIndicator("+50 ⏩");
    }

    startBtn.addEventListener("click", startReading);
    fullscreenBtn.addEventListener("click", startReadingFullscreen);
    pauseBtn.addEventListener("click", pauseReading);
    resumeBtn.addEventListener("click", resumeReading);
    stopBtn.addEventListener("click", stopReading);
    rewindBtn.addEventListener("click", rewind);
    skipBtn.addEventListener("click", skip);

    readerPanel.addEventListener("click", (e) => {
      if (e.target.closest(".fullscreen-controls") || e.target === exitHotspot) return;
      if (!rsvpRunning) return;
      rsvpPaused ? resumeReading() : pauseReading();
    });

    readerPanel.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        const delta = e.deltaY;
        const step = 50;
        if (delta < 0) setSpeed(Math.min(1200, rsvpSpeed + step));
        else setSpeed(Math.max(150, rsvpSpeed - step));
        showIndicator(rsvpSpeed + " WPM");
      },
      { passive: false }
    );

    exitHotspot.addEventListener("click", () => {
      stopReading();
    });

    let touchStartY = null;
    readerPanel.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
      }
    });

    readerPanel.addEventListener("touchend", (e) => {
      if (touchStartY == null) return;
      const endY = e.changedTouches[0].clientY;
      const dy = endY - touchStartY;
      const threshold = 40;
      if (Math.abs(dy) > threshold) {
        if (dy > 0) {
          cleanMode = false;
          updateControlsVisibility();
        } else {
          cleanMode = true;
          updateControlsVisibility();
        }
      }
      touchStartY = null;
    });

    document.addEventListener("keydown", (e) => {
      if (!document.body.classList.contains("fullscreen-mode")) return;
      if (e.key.toLowerCase() === "h") {
        cleanMode = !cleanMode;
        updateControlsVisibility();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (isIpadSafari()) return;
      const fs = !!document.fullscreenElement;
      if (fs) {
        document.body.classList.add("fullscreen-mode");
        cleanMode = true;
      } else {
        document.body.classList.remove("fullscreen-mode");
        cleanMode = true;
      }
      updateControlsVisibility();
      ensureWordFits();
    });

    window.addEventListener("resize", ensureWordFits);

    if (isIpadSafari()) {
      document.body.addEventListener(
        "touchmove",
        (e) => {
          if (document.body.classList.contains("fullscreen-mode")) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    }

    setSpeed(400);
    fontValue.textContent = fontControl.value;
    orpOffsetValue.textContent = orpOffsetControl.value;

    /* ============================================================
       LIBRARY ENGINE + LINE NUMBERS
       ============================================================ */

    const LIB_KEY = "rsvp_library_v1";

    let library = (() => {
      try {
        const raw = localStorage.getItem(LIB_KEY);
        if (!raw) return { items: {} };
        const parsed = JSON.parse(raw);
        if (!parsed.items) parsed.items = {};
        return parsed;
      } catch {
        return { items: {} };
      }
    })();

    const libraryList = document.getElementById("libraryList");
    const librarySearch = document.getElementById("librarySearch");
    const librarySummary = document.getElementById("librarySummary");
    const saveToLibraryBtn = document.getElementById("saveToLibraryBtn");
    const newItemBtn = document.getElementById("newItemBtn");
    const exportLibraryBtn = document.getElementById("exportLibraryBtn");
    const importLibraryBtn = document.getElementById("importLibraryBtn");
    const libraryImportInput = document.getElementById("libraryImportInput");
    const clearTextBtn = document.getElementById("clearTextBtn");

    function uid() {
      return "i_" + Math.random().toString(36).slice(2, 10);
    }

    function snippet(text) {
      const t = text.trim().replace(/\s+/g, " ");
      return t.length > 80 ? t.slice(0, 80) + "…" : t || "Untitled";
    }

    function saveLibrary() {
      try {
        localStorage.setItem(LIB_KEY, JSON.stringify(library));
      } catch {}
    }

    function computeLineFromWordIndex(text, wordIndex) {
      if (!text) return 0;
      const words = text.split(/\s+/);
      const targetWord = words[wordIndex] || "";
      if (!targetWord) return 0;
      const pos = text.indexOf(targetWord);
      if (pos === -1) return 0;
      const lines = text.split(/\r?\n/);
      let charCount = 0;
      for (let i = 0; i < lines.length; i++) {
        charCount += lines[i].length + 1;
        if (charCount > pos) return i;
      }
      return lines.length - 1;
    }

    function computeWordIndexFromLine(text, lineNumber) {
      if (!text) return 0;
      const lines = text.split(/\r?\n/);
      const safeLine = Math.max(0, Math.min(lineNumber, lines.length - 1));
      const before = lines.slice(0, safeLine).join(" ");
      if (!before.trim()) return 0;
      return before.trim().split(/\s+/).length;
    }

    function autoAddCurrentText() {
      const text = inputText.value.trim();
      if (!text) return null;
      for (const id in library.items) {
        if (library.items[id].content === text) {
          return id;
        }
      }
      const id = uid();
      library.items[id] = {
        id,
        title: snippet(text),
        content: text,
        created: Date.now(),
        updated: Date.now(),
        progress: {
          index: 0,
          line: 0,
          mode: rsvpMode,
          speed: rsvpSpeed,
          timestamp: Date.now()
        }
      };
      saveLibrary();
      renderLibrary();
      return id;
    }

    function renderLibrary() {
      const query = librarySearch.value.toLowerCase();
      libraryList.innerHTML = "";
      const items = Object.values(library.items).sort(
        (a, b) => b.updated - a.updated
      );
      let count = 0;
      for (const item of items) {
        const haystack =
          (item.title || "").toLowerCase() +
          " " +
          (item.content || "").toLowerCase();
        if (query && !haystack.includes(query)) continue;
        count++;
        const totalWords = (item.content || "").split(/\s+/).filter(Boolean)
          .length;
        const idx = item.progress?.index || 0;
        const pct =
          totalWords > 0 ? Math.min(100, Math.floor((idx / totalWords) * 100)) : 0;
        const line = item.progress?.line ?? 0;
        const card = document.createElement("div");
        card.className = "item-card";
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="item-title-row">
            <div class="item-title" title="${item.title}">${item.title}</div>
            <div class="item-meta">${pct}% · line ${line + 1}</div>
          </div>
          <div class="item-progress-bar">
            <div class="item-progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="item-actions">
            <button class="btn btn-primary btn-continue">Continue</button>
            <button class="btn btn-ghost btn-restart">Start over</button>
            <button class="btn btn-ghost btn-jump">Jump to line</button>
            <button class="btn btn-ghost btn-rename">Rename</button>
            <button class="btn btn-danger btn-delete">Delete</button>
          </div>
        `;
        libraryList.appendChild(card);
      }
      librarySummary.textContent = count + " item" + (count === 1 ? "" : "s");
      attachItemEvents();
    }

    function attachItemEvents() {
      libraryList.querySelectorAll(".item-card").forEach((card) => {
        const id = card.dataset.id;
        const item = library.items[id];
        if (!item) return;
        card.querySelector(".btn-continue").onclick = () => {
          openItem(id, true);
        };
        card.querySelector(".btn-restart").onclick = () => {
          openItem(id, false);
        };
        card.querySelector(".btn-jump").onclick = () => {
          const lineStr = prompt(
            "Enter line number to jump to (1-based):",
            (item.progress?.line ?? 0) + 1
          );
          if (!lineStr) return;
          const lineNum = parseInt(lineStr, 10);
          if (isNaN(lineNum) || lineNum < 1) return;
          const index = computeWordIndexFromLine(item.content, lineNum - 1);
          forceStartReading(index, true);
        };
        card.querySelector(".btn-rename").onclick = () => {
          const name = prompt("Rename item:", item.title || "Untitled");
          if (!name) return;
          item.title = name.trim();
          item.updated = Date.now();
          saveLibrary();
          renderLibrary();
        };
        card.querySelector(".btn-delete").onclick = () => {
          if (!confirm("Delete this item?")) return;
          delete library.items[id];
          saveLibrary();
          renderLibrary();
        };
      });
    }

    function openItem(id, resume) {
      const item = library.items[id];
      if (!item) return;
      inputText.value = item.content || "";
      charCount.textContent = inputText.value.length + " characters";
      currentLibraryItemId = id;
      const startIndex = resume ? item.progress?.index || 0 : 0;
      forceStartReading(startIndex, true);
    }

    saveToLibraryBtn.addEventListener("click", () => {
      const id = autoAddCurrentText();
      if (id) showIndicator("Saved");
    });

    newItemBtn.addEventListener("click", () => {
      inputText.value = "";
      charCount.textContent = "0 characters";
      inputText.focus();
    });

    clearTextBtn.addEventListener("click", () => {
      inputText.value = "";
      charCount.textContent = "0 characters";
    });

    librarySearch.addEventListener("input", renderLibrary);

    exportLibraryBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(library, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rsvp_library.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    importLibraryBtn.addEventListener("click", () => {
      libraryImportInput.value = "";
      libraryImportInput.click();
    });

    libraryImportInput.addEventListener("change", async () => {
      const file = libraryImportInput.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.items) throw new Error();
        library = data;
        saveLibrary();
        renderLibrary();
      } catch {
        alert("Invalid library file.");
      }
    });

    onProgressUpdate = (id, index, mode, speed) => {
      const item = library.items[id];
      if (!item) return;
      item.progress.index = index;
      item.progress.mode = mode;
      item.progress.speed = speed;
      item.progress.line = computeLineFromWordIndex(item.content, index);
      item.progress.timestamp = Date.now();
      item.updated = Date.now();
      saveLibrary();
      renderLibrary();
    };

    renderLibrary();
  </script>
</body>
</html>
