<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP Reader — True Fullscreen + Swipe Controls</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --bg-softer: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.15);
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --text-soft: #9ca3af;
      --border: #1f2937;
      --danger: #f97373;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-soft: 0 18px 45px rgba(15,23,42,0.85);
      --fade-duration: 300ms;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 101vh;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%);
      color: var(--text);
    }

    body.fullscreen-mode {
      background: #000 !important;
      overflow: hidden !important;
    }

    .app-shell {
      display: flex;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    /* Sidebar */

    .sidebar {
      width: 320px;
      min-width: 260px;
      max-width: 360px;
      background: #020617;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: var(--shadow-soft);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .sidebar-summary {
      font-size: 11px;
      color: var(--text-soft);
    }

    .sidebar-search {
      flex: 1;
      background: #020617;
      border-radius: var(--radius-md);
      border: 1px solid rgba(148,163,184,0.25);
      padding: 6px 9px;
      font-size: 12px;
      color: var(--text);
    }

    .btn {
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.35);
      background: #1f2937;
      color: var(--text);
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .btn-primary {
      border-color: rgba(56,189,248,0.7);
      color: var(--accent);
    }

    .btn-danger {
      border-color: rgba(248,113,113,0.7);
      color: #fecaca;
    }

    /* Main */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Reader */

    .reader-panel {
      flex: 1;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148,163,184,0.25);
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .reader-panel.active {
      display: flex;
    }

    .reader-inner {
      max-width: 700px;
      width: 100%;
      text-align: center;
      padding: 12px;
    }

    .orp-word {
      font-size: 64px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .orp-word .orp {
      color: #ef4444;
    }

    .reader-sub {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-soft);
    }

    /* Fullscreen controls */

    .fullscreen-controls {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .fullscreen-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .indicator {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 11px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .indicator.visible {
      opacity: 1;
    }

    /* Hide UI in fullscreen */

    body.fullscreen-mode .sidebar,
    body.fullscreen-mode .top-bar,
    body.fullscreen-mode .controls-row,
    body.fullscreen-mode .editor-panel {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="sidebar-title">Library</div>
          <div class="sidebar-summary" id="librarySummary">0 items</div>
        </div>
        <button class="btn" id="newItemBtn">+ New</button>
      </div>

      <input type="text" id="librarySearch" class="sidebar-search" placeholder="Search..." />
      <div id="libraryList" style="flex:1; overflow-y:auto;"></div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="top-bar">
        <div class="app-title">RSVP Reader</div>
        <div class="controls-row">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn" id="saveToLibraryBtn">Save</button>
        </div>
      </div>

      <textarea id="inputText" style="flex:1; border-radius:12px; padding:12px; background:#020617; color:#fff;"></textarea>

      <!-- Reader -->
      <section class="reader-panel" id="readerPanel">
        <div class="reader-inner">
          <div class="orp-word" id="orpWord"></div>
          <div class="reader-sub" id="readerSub"></div>
        </div>

        <div class="fullscreen-controls" id="fullscreenControls">
          <div style="display:flex; gap:6px;">
            <button class="btn" id="rewindBtn">⏪ -50</button>
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn" id="resumeBtn" style="display:none;">Resume</button>
            <button class="btn" id="stopBtn">Stop</button>
            <button class="btn" id="skipBtn">+50 ⏩</button>
          </div>
        </div>

        <div class="indicator" id="indicator"></div>
      </section>
    </main>
  </div>

  <script>
    /* ============================================================
       TRUE FULLSCREEN + SWIPE‑LEFT CONTROLS
       ============================================================ */

    const readerPanel = document.getElementById("readerPanel");
    const fullscreenControls = document.getElementById("fullscreenControls");
    const indicator = document.getElementById("indicator");

    let cleanMode = true;

    function enterFullscreenReal() {
      const el = readerPanel;

      if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.requestFullscreen) {
        el.requestFullscreen();
      }

      document.body.classList.add("fullscreen-mode");
      cleanMode = true;
      updateControlsVisibility();
    }

    function exitFullscreenReal() {
      if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
      } else if (document.fullscreenElement) {
        document.exitFullscreen();
      }

      document.body.classList.remove("fullscreen-mode");
      cleanMode = true;
      updateControlsVisibility();
    }

    function updateControlsVisibility() {
      if (cleanMode) {
        fullscreenControls.classList.remove("visible");
      } else {
        fullscreenControls.classList.add("visible");
      }
    }

    /* Swipe-left / swipe-right */

    let touchStartX = null;

    readerPanel.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    });

    readerPanel.addEventListener("touchend", (e) => {
      if (touchStartX == null) return;

      const endX = e.changedTouches[0].clientX;
      const dx = endX - touchStartX;
      const threshold = 40;

      if (Math.abs(dx) > threshold) {
        if (dx < 0) {
          cleanMode = false;
          updateControlsVisibility();
        } else {
          cleanMode = true;
          updateControlsVisibility();
        }
      }

      touchStartX = null;
    });

    /* ============================================================
       RSVP ENGINE (shortened for clarity — same logic as before)
       ============================================================ */

    let rsvpWords = [];
    let rsvpIndex = 0;
    let rsvpSpeed = 400;
    let rsvpDelay = 60000 / rsvpSpeed;
    let rsvpPaused = false;
    let rsvpRunning = false;

    const inputText = document.getElementById("inputText");
    const orpWord = document.getElementById("orpWord");
    const readerSub = document.getElementById("readerSub");

    function tokenize(text) {
      return text.replace(/\s+/g, " ").trim().split(" ");
    }

    function highlightORP(word) {
      const pivot = Math.min(2, word.length - 1);
      return (
        word.slice(0, pivot) +
        '<span class="orp">' +
        word[pivot] +
        "</span>" +
        word.slice(pivot + 1)
      );
    }

    function renderToken() {
      const word = rsvpWords[rsvpIndex] || "";
      orpWord.innerHTML = highlightORP(word);
      readerSub.textContent = `${rsvpIndex + 1} / ${rsvpWords.length}`;
    }

    function loop(ts) {
      if (!rsvpRunning || rsvpPaused) return;

      rsvpIndex++;
      if (rsvpIndex >= rsvpWords.length) {
        stopReading();
        return;
      }

      renderToken();
      setTimeout(() => requestAnimationFrame(loop), rsvpDelay);
    }

    function startReading() {
      const text = inputText.value.trim();
      if (!text) return;

      rsvpWords = tokenize(text);
      rsvpIndex = 0;
      rsvpRunning = true;
      rsvpPaused = false;

      readerPanel.classList.add("active");
      enterFullscreenReal();
      renderToken();
      requestAnimationFrame(loop);
    }

    function pauseReading() {
      rsvpPaused = true;
      document.getElementById("pauseBtn").style.display = "none";
      document.getElementById("resumeBtn").style.display = "inline-flex";
    }

    function resumeReading() {
      rsvpPaused = false;
      document.getElementById("resumeBtn").style.display = "none";
      document.getElementById("pauseBtn").style.display = "inline-flex";
      requestAnimationFrame(loop);
    }

    function stopReading() {
      rsvpRunning = false;
      rsvpPaused = false;
      readerPanel.classList.remove("active");
      exitFullscreenReal();
    }

    document.getElementById("startBtn").onclick = startReading;
    document.getElementById("pauseBtn").onclick = pauseReading;
    document.getElementById("resumeBtn").onclick = resumeReading;
    document.getElementById("stopBtn").onclick = stopReading;

    document.getElementById("rewindBtn").onclick = () => {
      rsvpIndex = Math.max(0, rsvpIndex - 50);
      renderToken();
    };

    document.getElementById("skipBtn").onclick = () => {
      rsvpIndex = Math.min(rsvpWords.length - 1, rsvpIndex + 50);
      renderToken();
    };
  </script>
</body>
</html>
